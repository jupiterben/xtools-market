name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run registry:verify
      - run: npm run tools:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Static source smoke test
        run: |
          npm run preview > /tmp/market-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/market-preview.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:1430/health.json; then
              npm run site:verify -- http://127.0.0.1:1430/
              exit 0
            fi
            sleep 1
          done
          exit 1
